name: Rapid SCADA Linux Build

on:
  workflow_dispatch:
    inputs:
      dotnetCommand:
        description: 'Run build or clean command?'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - clean
      dotnetConfiguration:
        description: 'Select Release or Debug configuration?'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Inject WindowsDesktop SDK into Linux
        shell: bash
        run: |
          chmod +x ./Script/setup-windowsdesktop-sdk.sh
          ./Script/setup-windowsdesktop-sdk.sh

      - name: Run Bash build script
        shell: bash
        run: |
          chmod +x ./Script/compile.sh
          ./Script/compile.sh -t "${{ inputs.dotnetCommand }}" -c "${{ inputs.dotnetConfiguration }}"

      - name: Upload build artifacts
        if: ${{ inputs.dotnetCommand == 'build' }}
        uses: actions/upload-artifact@v4
        with:
          name: rapid-scada-linux-${{ inputs.dotnetConfiguration }}
          path: |
            ScadaCommon/**/bin/${{ inputs.dotnetConfiguration }}/
            ScadaAgent/**/bin/${{ inputs.dotnetConfiguration }}/
            ScadaComm/**/bin/${{ inputs.dotnetConfiguration }}/
            ScadaComm/OpenDrivers/**/bin/${{ inputs.dotnetConfiguration }}/
            ScadaComm/OpenDrivers2/**/bin/${{ inputs.dotnetConfiguration }}/
            ScadaServer/**/bin/${{ inputs.dotnetConfiguration }}/
            ScadaServer/OpenModules/**/bin/${{ inputs.dotnetConfiguration }}/
            ScadaWeb/**/bin/${{ inputs.dotnetConfiguration }}/
            ScadaWeb/Mimics/**/bin/${{ inputs.dotnetConfiguration }}/
            ScadaWeb/OpenPlugins/**/bin/${{ inputs.dotnetConfiguration }}/
            ScadaAdmin/**/bin/${{ inputs.dotnetConfiguration }}/
            ScadaAdmin/OpenExtensions/**/bin/${{ inputs.dotnetConfiguration }}/
            ScadaReport/**/bin/${{ inputs.dotnetConfiguration }}/
